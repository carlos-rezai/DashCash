<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/styles.css">
<link rel="stylesheet" href="tokens/dashcash-dark.css">
<script src="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/_ds_bundle.js"></script>
</helmet>
<span style="display: inline-flex; align-items: center; gap: {{ gap }}; color: {{ ink }};">
  <svg width="{{ px }}" height="{{ px }}" viewBox="0 0 32 32" fill="none" aria-label="DashCash" style="display: block; flex: none;">
    <defs><clipPath id="cd-c-cut"><path d="M-2 -2 H34 V34 H-2 Z M16 16 L32.66 16 L23.46 25.2 L16 25.2 Z" clipRule="evenodd"></path></clipPath></defs>
    <path d="M25.2 6.8 A13 13 0 1 0 29 16" stroke="{{ path }}" strokeWidth="{{ sw }}" strokeLinecap="butt" clipPath="url(#cd-c-cut)"></path>
    <path d="M3.3 19 L8.5 16.5 L12.5 19.5 L16 16" stroke="{{ path }}" strokeWidth="{{ sw }}" strokeLinejoin="miter"></path>
    <path d="M16 16 L22.128 9.872" stroke="{{ path }}" strokeWidth="{{ sw }}" pathLength="6" strokeDasharray="2 1" strokeDashoffset="2"></path>
    <path d="{{ lastDash }}" stroke="{{ path }}" strokeWidth="{{ sw }}"></path>
  </svg>
  <sc-if value="{{ showWord }}"><span style="font-family: var(--font-heading); font-weight: 600; font-size: {{ fs }}; letter-spacing: 0.02em; line-height: 1;">DashCash</span></sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:80},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;mark&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;'full' | 'mark'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:28,&quot;min&quot;:16,&quot;max&quot;:256,&quot;tsType&quot;:&quot;number&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark' | 'light'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const s = p.size ?? 28;
    const light = p.theme === 'light';
    return {
      px: s, sw: s <= 20 ? 3.2 : s <= 32 ? 2.6 : 2.2, lastDash: (() => { const w = s <= 20 ? 3.2 : s <= 32 ? 2.6 : 2.2, k = 0.70710678, p = (t) => (16 + k * t).toFixed(3) + ' ' + (16 - k * t).toFixed(3); return 'M' + p(13 * 7 / 9) + ' L' + p(13 + w / 2); })(), ruleW: s <= 20 ? 1.6 : s <= 32 ? 1.3 : 1.1, showWord: p.variant !== 'mark', fs: Math.round(s * 0.78) + 'px', gap: Math.round(s * 0.32) + 'px',
      ink: light ? '#1d1f20' : 'var(--color-text)',
      path: light ? '#416180' : 'var(--color-accent-600)',
      ground: light ? '#f2f2f3' : 'var(--color-bg)'
    };
  }
}
</script>
</body>
</html>
