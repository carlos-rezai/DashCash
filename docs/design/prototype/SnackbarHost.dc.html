<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/styles.css">
<link rel="stylesheet" href="tokens/dashcash-dark.css">
<script src="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/_ds_bundle.js"></script>
</helmet>
<div aria-label="Notifications" style="position: {{ pos }}; right: 24px; bottom: 24px; z-index: 60; width: 400px; max-width: calc(100vw - 48px); display: flex; flex-direction: column; gap: 10px; pointer-events: none;">
  <sc-for list="{{ items }}" as="t" hint-placeholder-count="0">
    <div style="pointer-events: auto;">
      <dc-import name="Snackbar" tone="{{ t.tone }}" title="{{ t.title }}" message="{{ t.message }}" icon="{{ t.icon }}" loading="{{ t.loading }}" action-label="{{ t.actionLabel }}" action-icon="{{ t.actionIcon }}" secondary-label="{{ t.secondaryLabel }}" on-action="{{ t.onAction }}" on-secondary="{{ t.onSecondary }}" on-close="{{ t.onClose }}" hint-size="100%,90px"></dc-import>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:400},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{ id: string; tone: 'success' | 'error' | 'info' | 'warning'; title: string; message?: string; icon?: IconName; actionLabel?: string; actionIcon?: IconName; onAction?: () =&gt; void; secondaryLabel?: string; onSecondary?: () =&gt; void; autoHide?: number; dismissOnAction?: boolean }&gt;&quot;},&quot;inline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onDismiss&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const dismiss = (id) => p.onDismiss && p.onDismiss(id);
    const items = (p.items || []).slice(-3).map((t) => Object.assign({}, t, {
      onAction: () => { t.onAction && t.onAction(); if (t.dismissOnAction !== false) dismiss(t.id); },
      onSecondary: () => { t.onSecondary && t.onSecondary(); dismiss(t.id); },
      onClose: () => dismiss(t.id)
    }));
    return { items, pos: p.inline ? 'static' : 'fixed' };
  }
}
</script>
</body>
</html>
