<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/styles.css">
<link rel="stylesheet" href="tokens/dashcash-dark.css">
<script src="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/_ds_bundle.js"></script>
</helmet>
<sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
  <div class="dialog-backdrop" onClick="{{ backdrop }}" style="position: fixed; inset: 0; z-index: 50; background: var(--sb-backdrop);">
    <div class="dialog blueprint elev-lg" role="dialog" aria-modal="true" onClick="{{ stop }}" style="width: {{ w }}; max-width: 100%; background: var(--sb-raised-bg); border-color: var(--sb-card-border); padding: var(--space-6); gap: var(--space-4);">
      
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3);">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span class="dialog-title" style="font-size: 22px;">{{ title }}</span>
          <sc-if value="{{ subtitle }}"><span style="font-size: 13px; color: var(--sb-text-muted);">{{ subtitle }}</span></sc-if>
        </div>
        <dc-import name="Button" variant="ghost" size="sm" icon="x" title="Close" on-click="{{ onClose }}" hint-size="28px,28px"></dc-import>
      </div>
      <div style="display: flex; flex-direction: column; gap: var(--space-4); font-size: 14px;">{{ children }}</div>
      <sc-if value="{{ actions }}"><div class="dialog-actions" style="margin-top: 0; padding-top: var(--space-2);">{{ actions }}</div></sc-if>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:420},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Edit account&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string | undefined&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:460,&quot;min&quot;:320,&quot;max&quot;:800,&quot;tsType&quot;:&quot;number&quot;},&quot;actions&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;React.ReactNode&quot;},&quot;children&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;React.ReactNode&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    this.onKey = (e) => { if (e.key === 'Escape' && this.props.open && this.props.onClose) this.props.onClose(); };
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); }
  renderVals() {
    const p = this.props;
    return {
      open: !!p.open, title: p.title, subtitle: p.subtitle, actions: p.actions, onClose: p.onClose,
      w: (p.width ?? 460) + 'px',
      backdrop: () => p.onClose && p.onClose(),
      stop: (e) => e.stopPropagation()
    };
  }
}
</script>
</body>
</html>
