<html>
<head>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/styles.css">
<link rel="stylesheet" href="tokens/dashcash-dark.css">
<script src="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/_ds_bundle.js"></script>
</helmet>
<div style="display: flex; flex-direction: column; gap: var(--space-6);">

    </dc-import>
  </sc-if>
  {{ children }}
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1160,&quot;height&quot;:200},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dashboard&quot;,&quot;tsType&quot;:&quot;string | undefined&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Today · 26 Oct 2026&quot;,&quot;tsType&quot;:&quot;string | undefined&quot;},&quot;primaryAction&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ label: string; icon?: IconName; onClick: () =&gt; void } | undefined&quot;},&quot;children&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;React.ReactNode&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { title: p.title, subtitle: p.subtitle, action: p.primaryAction };
  }
}
</script>
</body>
