<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/styles.css">
<link rel="stylesheet" href="tokens/dashcash-dark.css">
<script src="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/_ds_bundle.js"></script>
</helmet>
<button type="button" role="switch" aria-checked="{{ on }}" aria-label="{{ aria }}" onClick="{{ toggle }}" disabled="{{ disabled }}" style="display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; color: var(--color-text); font: inherit; font-size: 14px; cursor: pointer; opacity: {{ op }};">
  <span style="position: relative; width: 34px; height: 18px; flex: none; border: 1px solid {{ bd }}; background: {{ track }}; transition: background 150ms ease, border-color 150ms ease;">
    <span style="position: absolute; top: 2px; left: {{ knobX }}; width: 12px; height: 12px; background: {{ knob }}; transition: left 150ms ease;"></span>
  </span>
  <sc-if value="{{ label }}"><span style="line-height: 1.3;">{{ label }}</span></sc-if>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:50},&quot;checked&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Check for updates automatically&quot;,&quot;tsType&quot;:&quot;string | undefined&quot;},&quot;ariaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string | undefined&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(checked: boolean) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const on = !!p.checked;
    return {
      on, label: p.label, aria: p.label ? undefined : p.ariaLabel, disabled: !!p.disabled, op: p.disabled ? 0.45 : 1,
      bd: on ? 'var(--color-accent)' : 'var(--color-neutral-400)',
      track: on ? 'var(--color-accent)' : 'transparent',
      knob: on ? 'var(--color-bg)' : 'var(--color-neutral-600)',
      knobX: on ? '18px' : '2px',
      toggle: () => !p.disabled && p.onChange && p.onChange(!on)
    };
  }
}
</script>
</body>
</html>
