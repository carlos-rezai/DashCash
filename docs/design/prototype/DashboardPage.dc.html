<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/styles.css">
<link rel="stylesheet" href="tokens/dashcash-dark.css">
<script src="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/_ds_bundle.js"></script>
</helmet>
<dc-import name="PageLayout" title="Dashboard" subtitle="Today · 26 Oct 2026 · balances include imported transactions only" hint-size="100%,900px">
  <dc-import name="BalanceChart" default-range="{{ range }}" hint-size="100%,440px"></dc-import>
  <dc-import name="SavingPanel" on-open-account="{{ openAccount }}" on-navigate="{{ nav }}" hint-size="100%,330px"></dc-import>
  <dc-import name="BalanceTable" hint-size="100%,420px"></dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1208,&quot;height&quot;:900},&quot;chartRange&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;1y&quot;,&quot;3y&quot;,&quot;payoff&quot;],&quot;default&quot;:&quot;3y&quot;,&quot;tsType&quot;:&quot;'1y' | '3y' | 'payoff'&quot;},&quot;onNavigate&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(page: PageId, accountId?: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const nav = this.props.onNavigate || (() => {});
    return {
      range: this.props.chartRange || 'payoff', nav,
      importAction: { label: 'Import CSV', icon: 'upload', onClick: () => nav('import') },
      openAccount: (id) => nav('accounts', id)
    };
  }
}
</script>
</body>
</html>
