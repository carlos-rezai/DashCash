<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/styles.css">
<link rel="stylesheet" href="tokens/dashcash-dark.css">
<script src="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/_ds_bundle.js"></script>
<script src="lib/store.js"></script>
</helmet>
<div role="button" tabIndex="0" onClick="{{ open }}" style="height: 100%; cursor: pointer;" style-hover="background: var(--sb-hover);">
  <dc-import name="Card" kicker="{{ kicker }}" title="{{ name }}" padding="lg" hint-size="100%,240px">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 12px; color: var(--sb-text-muted);">{{ balanceLabel }}</span>
      <dc-import name="Amount" cents="{{ anchor }}" tone="{{ amountTone }}" size="xl" hint-size="180px,40px"></dc-import>
    </div>
    <dc-import name="Sparkline" past="{{ past }}" future="{{ future }}" color="{{ color }}" height="{{ 40 }}" hint-size="100%,40px"></dc-import>
    <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--sb-text-faint); margin-top: -6px;"><span>{{ fromLabel }}</span><span>Today</span><span>{{ toLabel }}</span></div>
    <div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; padding-top: var(--space-2); border-top: 1px solid var(--color-divider);">
      <div style="display: flex; justify-content: space-between; gap: 8px;"><span style="color: var(--sb-text-muted);">Goal</span><span>{{ goal }}</span></div>
      <div style="display: flex; justify-content: space-between; gap: 8px;"><span style="color: var(--sb-text-muted);">Last import</span><span style="color: {{ importColor }};">{{ importShort }}</span></div>
      <div style="display: flex; justify-content: space-between; gap: 8px;"><span style="color: var(--sb-text-muted);">{{ factLabel }}</span><span style="font-variant-numeric: tabular-nums; color: {{ factColor }};">{{ fact }}</span></div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
      <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--color-accent-600);">Open details<dc-import name="Icon" glyph="arrowRight" size="{{ 14 }}" hint-size="14px,14px"></dc-import></span>
      <dc-import name="Button" variant="secondary" size="sm" icon="pencil" label="Edit" on-click="{{ edit }}" hint-size="70px,28px"></dc-import>
    </div>
  </dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:330},&quot;accountId&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;postbank&quot;,&quot;sparkasse&quot;,&quot;renault&quot;,&quot;card&quot;,&quot;darlehen&quot;],&quot;default&quot;:&quot;sparkasse&quot;,&quot;tsType&quot;:&quot;AccountId&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(accountId: string) =&gt; void&quot;},&quot;onEdit&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(accountId: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    const go = () => { this.unsub = window.SB.subscribe(() => this.forceUpdate()); this.forceUpdate(); };
    if (window.SB) go(); else this.t = setInterval(() => { if (window.SB) { clearInterval(this.t); go(); } }, 40);
  }
  componentWillUnmount() { this.unsub && this.unsub(); clearInterval(this.t); }
  renderVals() {
    const SB = window.SB, p = this.props;
    const a = SB && SB.account(p.accountId || 'sparkasse');
    if (!a) return {};
    const s = SB.series(a), st = SB.streak(a);
    const past = s.hist.slice(SB.TODAY_IDX - 12).concat([s.today]);
    const future = s.proj.slice(SB.TODAY_IDX, SB.TODAY_IDX + 13);
    let factLabel = 'Streak', fact = st.current + (st.current === 1 ? ' month' : ' months') + ' in a row';
    if (a.type === 'mortgage') { const pay = SB.payoffIdx(); factLabel = 'Paid off'; fact = pay ? SB.mLabel(pay) : 'n/a'; }
    const factColor = a.type === 'mortgage' ? 'var(--sb-milestone)' : 'var(--color-text)';
    return {
      factColor,
      kicker: SB.TYPES[a.type].label, name: a.name, anchor: a.anchor, color: SB.TYPES[a.type].color,
      amountTone: a.type === 'mortgage' ? 'negative' : 'auto',
      balanceLabel: a.type === 'mortgage' ? 'Restschuld today' : 'Balance today',
      past, future, fromLabel: SB.mShort(SB.TODAY_IDX - 12), toLabel: SB.mShort(SB.TODAY_IDX + 12),
      goal: SB.goalText(a), factLabel, fact,
      importShort: SB.importAge(a).short, importColor: SB.importAge(a).stale ? 'var(--color-accent-600)' : 'var(--color-text)',
      open: () => p.onOpen && p.onOpen(a.id),
      edit: (e) => { e && e.stopPropagation && e.stopPropagation(); p.onEdit && p.onEdit(a.id); }
    };
  }
}
</script>
</body>
</html>
