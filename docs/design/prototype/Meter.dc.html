<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/styles.css">
<link rel="stylesheet" href="tokens/dashcash-dark.css">
<script src="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/_ds_bundle.js"></script>
</helmet>
<div role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ pct }}" style="position: relative; width: 100%; height: {{ h }}; border: 1px solid var(--color-divider); background: var(--sb-ground-sunken);">
  <div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{ projW }}; border: 1px dashed {{ fill }}; border-left: 0; opacity: 0.8;"></div>
  <div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{ valW }}; background: {{ fill }}; transition: width 300ms ease;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:40},&quot;value&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.4,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;},&quot;projected&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.8,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number | undefined&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;neutral&quot;,&quot;warning&quot;,&quot;danger&quot;],&quot;default&quot;:&quot;neutral&quot;,&quot;tsType&quot;:&quot;'neutral' | 'warning' | 'danger'&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;min&quot;:2,&quot;max&quot;:24,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const cl = (x) => Math.max(0, Math.min(1, x || 0));
    const v = cl(p.value), pr = Math.max(v, cl(p.projected));
    const fills = { neutral: 'var(--color-accent)', warning: 'var(--sb-warning)', danger: 'var(--sb-danger)' };
    return { pct: Math.round(v * 100), valW: v * 100 + '%', projW: pr > v ? pr * 100 + '%' : '0', fill: fills[p.tone || 'neutral'], h: (p.height ?? 6) + 'px' };
  }
}
</script>
</body>
</html>
