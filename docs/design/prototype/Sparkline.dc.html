<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/styles.css">
<link rel="stylesheet" href="tokens/dashcash-dark.css">
<script src="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/_ds_bundle.js"></script>
</helmet>
<svg width="100%" height="{{ h }}" viewBox="{{ vb }}" preserveAspectRatio="none" style="display: block; overflow: visible;">
  <path d="{{ solid }}" fill="none" stroke="{{ color }}" strokeWidth="1.5" vectorEffect="non-scaling-stroke"></path>
  <path d="{{ dashed }}" fill="none" stroke="{{ color }}" strokeWidth="1.5" strokeDasharray="4 3" vectorEffect="non-scaling-stroke" opacity="0.85"></path>
  <line x1="{{ tx }}" x2="{{ tx }}" y1="0" y2="{{ h }}" stroke="var(--color-divider)" strokeWidth="1" vectorEffect="non-scaling-stroke"></line>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:60},&quot;past&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Cents[]&quot;},&quot;future&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Cents[]&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#94bce3&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:36,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const past = (p.past || []).filter((v) => v != null), future = (p.future || []).filter((v) => v != null);
    const h = p.height ?? 36, W = 200;
    const all = past.concat(future);
    if (!all.length) return { h, vb: `0 0 ${W} ${h}`, solid: '', dashed: '', tx: -10, color: p.color };
    const min = Math.min(...all), max = Math.max(...all), span = max - min || 1;
    const n = all.length - 1 || 1;
    const pt = (v, i) => `${((i / n) * W).toFixed(1)},${(h - 2 - ((v - min) / span) * (h - 4)).toFixed(1)}`;
    const solid = past.length ? 'M' + past.map((v, i) => pt(v, i)).join(' L') : '';
    const off = Math.max(0, past.length - 1);
    const fut = past.length ? [past[past.length - 1]].concat(future) : future;
    const dashed = fut.length ? 'M' + fut.map((v, i) => pt(v, i + off)).join(' L') : '';
    return { h, vb: `0 0 ${W} ${h}`, solid, dashed, tx: ((off / n) * W).toFixed(1), color: p.color || 'var(--color-accent)' };
  }
}
</script>
</body>
</html>
