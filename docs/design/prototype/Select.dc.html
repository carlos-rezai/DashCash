<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/styles.css">
<link rel="stylesheet" href="tokens/dashcash-dark.css">
<script src="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/_ds_bundle.js"></script>
</helmet>
<label style="position: relative; display: flex; align-items: center; width: {{ w }};">
  <sc-if value="{{ swatch }}"><span style="position: absolute; left: 10px; top: 50%; margin-top: -4px; width: 8px; height: 8px; background: {{ swatch }}; pointer-events: none;"></span></sc-if>
  <select ref="{{ selRef }}" class="input" value="{{ value }}" onChange="{{ change }}" style="appearance: none; -webkit-appearance: none; cursor: pointer; padding-left: {{ pl }}; padding-right: 30px; box-sizing: border-box; height: {{ h }}; min-height: {{ h }}; padding-top: 0; padding-bottom: 0; line-height: 1.2; color: {{ fg }}; font-size: {{ fs }}; border-color: {{ bc }};">
    <sc-if value="{{ placeholder }}"><option value="">{{ placeholder }}</option></sc-if>
    <sc-for list="{{ options }}" as="o" hint-placeholder-count="3"><option value="{{ o.value }}">{{ o.label }}</option></sc-for>
  </select>
  <span style="position: absolute; right: 9px; top: 0; bottom: 0; display: flex; align-items: center; pointer-events: none; color: var(--sb-text-muted);"><dc-import name="Icon" glyph="chevronDown" size="{{ 14 }}" hint-size="14px,14px"></dc-import></span>
</label>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:60},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{ value: string; label: string; color?: string }&gt;&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Pick a category&quot;,&quot;tsType&quot;:&quot;string | undefined&quot;},&quot;showSwatch&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sm&quot;,&quot;md&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;'sm' | 'md'&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;100%&quot;,&quot;tsType&quot;:&quot;string | undefined&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;warning&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;'default' | 'warning'&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(value: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  selRef = React.createRef();
  sync() { const el = this.selRef.current, v = this.props.value ?? ''; if (el && el.value !== String(v)) el.value = String(v); }
  componentDidMount() { this.sync(); let n = 0; const tick = () => { this.sync(); if (++n < 20) this.raf = requestAnimationFrame(tick); }; this.raf = requestAnimationFrame(tick); }
  componentDidUpdate() { this.sync(); requestAnimationFrame(() => this.sync()); }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }
  renderVals() {
    const p = this.props;
    const options = p.options || [];
    const sel = options.find((o) => o.value === p.value);
    const swatch = p.showSwatch && sel ? sel.color : null;
    return {
      selRef: this.selRef, options, value: p.value ?? '', placeholder: p.placeholder, swatch,
      pl: swatch ? '26px' : '10px', w: p.width || '100%',
      h: p.size === 'sm' ? '28px' : '36px', fs: p.size === 'sm' ? '13px' : '14px',
      fg: p.value ? 'var(--color-text)' : p.tone === 'warning' ? 'var(--sb-warning)' : 'var(--sb-text-muted)',
      bc: p.tone === 'warning' ? 'var(--sb-warning)' : undefined,
      change: (e) => p.onChange && p.onChange(e.target.value)
    };
  }
}
</script>
</body>
</html>
