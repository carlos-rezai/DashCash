<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/styles.css">
<link rel="stylesheet" href="tokens/dashcash-dark.css">
<script src="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/_ds_bundle.js"></script>
</helmet>
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0;">
  <div style="display: flex; align-items: baseline; gap: 8px;">
    <span style="font-family: var(--font-heading); font-weight: 600; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums;">{{ current }}</span>
    <span style="font-size: 13px; color: var(--sb-text-muted); line-height: 1.25;">{{ unit }}</span>
    <span title="{{ milestoneTitle }}" style="margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--color-accent-600); white-space: nowrap;">
      <dc-import name="Icon" glyph="flag" size="{{ 12 }}" hint-size="12px,12px"></dc-import><span>{{ milestone }}</span>
    </span>
  </div>
  <div role="img" aria-label="{{ aria }}" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; align-items: end;">
    <sc-for list="{{ cells }}" as="c" hint-placeholder-count="11">
      <div title="{{ c.title }}" style="height: 20px; background: {{ c.bg }}; border: 1px solid {{ c.bd }}; position: relative;">
        <sc-if value="{{ c.broken }}"><span style="position: absolute; left: 50%; top: 3px; bottom: 3px; width: 1px; background: var(--sb-danger); transform: rotate(35deg);"></span></sc-if>
      </div>
    </sc-for>
    <div title="{{ nowTitle }}" style="position: relative; height: 28px; border: 1px dashed var(--color-accent-400); background: var(--sb-ground-sunken);">
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{ projH }}; border-top: 1px dashed var(--color-accent-600);"></div>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{ actH }}; background: var(--color-accent-600); transition: height 400ms ease;"></div>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; font-size: 10px; letter-spacing: 0.04em; color: var(--sb-text-faint); text-align: center;">
    <sc-for list="{{ labels }}" as="l" hint-placeholder-count="12"><span style="color: {{ l.color }};">{{ l.t }}</span></sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:110},&quot;current&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:8,&quot;tsType&quot;:&quot;number&quot;},&quot;best&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:11,&quot;tsType&quot;:&quot;number&quot;},&quot;nextMilestone&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:12,&quot;tsType&quot;:&quot;number&quot;},&quot;toMilestone&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;tsType&quot;:&quot;number&quot;},&quot;months&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{ label: string; full: string; met: boolean | null }&gt;&quot;},&quot;actual&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.3,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;},&quot;projected&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const months = p.months || [];
    const cells = months.map((m) => ({
      title: m.full + (m.met ? ' · goal met' : m.met === false ? ' · goal missed' : ' · no data'),
      bg: m.met ? 'var(--color-accent-500)' : m.met === false ? 'var(--sb-danger-tint)' : 'transparent',
      bd: m.met ? 'var(--color-accent-500)' : m.met === false ? 'var(--sb-danger)' : 'var(--color-neutral-300)',
      broken: m.met === false
    }));
    const labels = months.map((m) => ({ t: m.label[0], color: m.met === false ? 'var(--sb-danger)' : 'var(--sb-text-faint)' })).concat([{ t: 'Now', color: 'var(--color-accent-600)' }]);
    const a = Math.max(0, Math.min(1, p.actual || 0)), pr = Math.max(a, Math.min(1, p.projected || 0));
    const cur = p.current ?? 0;
    const to = p.toMilestone ?? 0;
    return {
      cells, labels, current: cur,
      unit: cur === 1 ? 'month in a row' : 'months in a row',
      milestone: to > 0 ? to + ' to ' + p.nextMilestone : 'Milestone',
      milestoneTitle: 'Best streak: ' + (p.best ?? cur) + ' months',
      actH: a * 100 + '%', projH: pr * 100 + '%',
      nowTitle: 'This month · ' + Math.round(a * 100) + '% so far' + (pr > a ? ', ' + Math.round(pr * 100) + '% with items still due' : ''),
      aria: cur + ' months in a row; this month ' + Math.round(a * 100) + '% of goal'
    };
  }
}
</script>
</body>
</html>
