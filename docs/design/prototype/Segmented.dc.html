<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/styles.css">
<link rel="stylesheet" href="tokens/dashcash-dark.css">
<script src="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/_ds_bundle.js"></script>
</helmet>
<div class="seg" role="radiogroup" style="display: inline-flex; box-sizing: border-box; height: {{ h }}; flex: none;">
  <sc-for list="{{ items }}" as="o" hint-placeholder-count="3">
    <button type="button" class="seg-opt" role="radio" aria-checked="{{ o.selected }}" onClick="{{ o.pick }}" style="background: {{ o.bg }}; color: {{ o.fg }}; border: 0; border-left: {{ o.bl }}; font: inherit; font-size: {{ fs }}; line-height: 1; height: 100%; display: inline-flex; align-items: center; justify-content: center; padding: 0 12px; white-space: nowrap; cursor: pointer;" style-hover="background: {{ o.hover }};">{{ o.label }}</button>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:60},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;3y&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{ value: string; label: string }&gt;&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(value: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const items = (p.options || []).map((o, i) => {
      const selected = o.value === p.value;
      return {
        label: o.label, selected,
        bg: selected ? 'var(--color-accent)' : 'transparent',
        hover: selected ? 'var(--color-accent-600)' : 'var(--sb-hover)',
        fg: selected ? 'var(--color-bg)' : 'var(--color-text)',
        bl: i === 0 ? '0' : '1px solid var(--color-divider)',
        pick: () => p.onChange && p.onChange(o.value)
      };
    });
    return { items, h: p.size === 'md' ? '36px' : '28px', fs: p.size === 'md' ? '14px' : '13px' };
  }
}
</script>
</body>
</html>
