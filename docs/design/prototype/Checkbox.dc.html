<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/styles.css">
<link rel="stylesheet" href="tokens/dashcash-dark.css">
<script src="_ds/industry-f2e85e32-8671-471e-b527-852aab1772ed/_ds_bundle.js"></script>
</helmet>
<button type="button" role="checkbox" aria-checked="{{ checked }}" onClick="{{ toggle }}" style="display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; color: var(--color-text); font: inherit; font-size: 14px; cursor: pointer;">
  <span style="width: 16px; height: 16px; flex: none; display: grid; place-items: center; border: 1px solid {{ bd }}; background: {{ bg }}; color: var(--color-bg);">
    <sc-if value="{{ checked }}"><dc-import name="Icon" glyph="check" size="{{ 12 }}" hint-size="12px,12px"></dc-import></sc-if>
  </span>
  <sc-if value="{{ label }}"><span style="line-height: 1.3;">{{ label }}</span></sc-if>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:50},&quot;checked&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Mark as recurring&quot;,&quot;tsType&quot;:&quot;string | undefined&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(checked: boolean) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = !!p.checked;
    return {
      checked: c, label: p.label,
      bd: c ? 'var(--color-accent)' : 'var(--color-neutral-400)',
      bg: c ? 'var(--color-accent)' : 'transparent',
      toggle: () => p.onChange && p.onChange(!c)
    };
  }
}
</script>
</body>
</html>
